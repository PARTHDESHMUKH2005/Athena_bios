# Deploys Athena to Cloudflare on every push to main that touches athena/.
# One-time setup: add the repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (Settings > Secrets and variables > Actions).
# Worker secrets (PRUNE_API_KEY, GROQ_API_KEY, ADMIN_TOKEN) live in Cloudflare and are not touched by this workflow.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
    paths: ['athena/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

concurrency:
  group: deploy-athena
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: athena
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            athena/package-lock.json
            athena/web/package-lock.json
      - run: npm ci
      - run: npm --prefix web ci
      - name: Typecheck and unit tests (a failing build is never deployed)
        run: |
          npm run typecheck
          npm test
          npm --prefix web run typecheck
      - run: npm run web:build
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply athena --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy the Worker and the web app
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
